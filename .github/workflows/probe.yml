name: Probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 probe.py
      - run: |
          git config user.name probe
          git config user.email probe@users.noreply.github.com
          git add result.txt
          git commit -qm "result [skip ci]"
          git push -q
