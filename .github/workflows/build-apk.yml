name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup platforms
        run: |
          set -o pipefail
          if ! ./tool/setup_platforms.sh 2>&1 | tee setup.log; then
            grep -n -i -E 'error|what went wrong|failed|exception|because' setup.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=setup::$(cat err.txt)"
            exit 1
          fi

      - name: Analyze
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log; then
            grep -n -E 'error' analyze.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=analyze::$(cat err.txt)"
            exit 1
          fi

      - name: Test
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee test.log; then
            grep -n -i -E 'error|failed|exception|Expected|Actual|Which|\.dart [0-9]+:[0-9]+|\[E\]' test.log | tail -50 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=test::$(cat err.txt)"
            exit 1
          fi

      - name: Build APK
        run: |
          set -o pipefail
          if ! flutter build apk --release --split-per-abi 2>&1 | tee build.log; then
            grep -n -i -E 'error|what went wrong|failed|exception|e: ' build.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=build::$(cat err.txt)"
            exit 1
          fi

      - name: Sign APK
        run: |
          set -o pipefail
          PASS=$(cat tool/signing/password.txt)
          SIGNER="$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            if ! "$SIGNER" sign --ks tool/signing/app.jks --ks-key-alias app \
                 --ks-pass pass:$PASS --key-pass pass:$PASS "$apk" 2>&1 | tee sign.log; then
              echo "::error title=sign::$(tail -5 sign.log | tr '\n' ' ')"
              exit 1
            fi
            "$SIGNER" verify "$apk"
          done
          ls -la build/app/outputs/flutter-apk/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: D. Tracking lab (build ${{ github.run_number }})
          body: |
            Per installare sul telefono scarica **app-arm64-v8a-release.apk**.
            Telefoni molto vecchi: app-armeabi-v7a-release.apk.
          files: build/app/outputs/flutter-apk/*-release.apk
